<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="cube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9eff"/>
      <stop offset="100%" style="stop-color:#0066cc"/>
    </linearGradient>
    <linearGradient id="lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#d4380d"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#bg)" stroke="#2a4a7f" stroke-width="2"/>

  <!-- 3D Cube - wireframe style -->
  <!-- Back face -->
  <polygon points="38,32 78,32 78,72 38,72" fill="none" stroke="#4a9eff" stroke-width="2.5" opacity="0.4"/>
  <!-- Front face -->
  <polygon points="28,42 68,42 68,82 28,82" fill="url(#cube)" fill-opacity="0.15" stroke="#4a9eff" stroke-width="2.5"/>
  <!-- Connecting edges -->
  <line x1="28" y1="42" x2="38" y2="32" stroke="#4a9eff" stroke-width="2.5" opacity="0.6"/>
  <line x1="68" y1="42" x2="78" y2="32" stroke="#4a9eff" stroke-width="2.5" opacity="0.6"/>
  <line x1="68" y1="82" x2="78" y2="72" stroke="#4a9eff" stroke-width="2.5" opacity="0.6"/>
  <line x1="28" y1="82" x2="38" y2="72" stroke="#4a9eff" stroke-width="2" opacity="0.3"/>

  <!-- Vertices dots -->
  <circle cx="28" cy="42" r="3" fill="#4a9eff"/>
  <circle cx="68" cy="42" r="3" fill="#4a9eff"/>
  <circle cx="28" cy="82" r="3" fill="#4a9eff"/>
  <circle cx="68" cy="82" r="3" fill="#4a9eff"/>
  <circle cx="38" cy="32" r="2.5" fill="#4a9eff" opacity="0.6"/>
  <circle cx="78" cy="32" r="2.5" fill="#4a9eff" opacity="0.6"/>
  <circle cx="78" cy="72" r="2.5" fill="#4a9eff" opacity="0.6"/>

  <!-- Magnifying glass -->
  <circle cx="85" cy="85" r="20" fill="none" stroke="url(#lens)" stroke-width="4"/>
  <circle cx="85" cy="85" r="14" fill="#ff6b35" fill-opacity="0.08"/>
  <line x1="99" y1="99" x2="114" y2="114" stroke="url(#lens)" stroke-width="5" stroke-linecap="round"/>

  <!-- Checkmark inside magnifier -->
  <polyline points="77,85 83,91 95,79" fill="none" stroke="#4ec990" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small text "BA" -->
  <text x="64" y="118" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#4a9eff" opacity="0.5">ANALYZER</text>
</svg>
